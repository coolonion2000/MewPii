version: "3.8"
services:
  mewpii:
    build: .
    ports:
      - "31041:31041"
    environment:
      # 必须设置：0.0.0.0 监听时无密码会拒绝启动
      PII_PASSWORD: ${PII_PASSWORD:?set PII_PASSWORD}
      # PII_PORT: "31041"
    volumes:
      # NAS 上 pi 的配置/会话/凭证持久化
      - pii-pi-state:/root/.pi
    restart: unless-stopped

volumes:
  pii-pi-state:
